name: PhoneMirror

options:
  bundleIdPrefix: com.edunavajas
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PhoneMirrorView:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: PhoneMirrorView
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edunavajas.phonemirror.view
        INFOPLIST_FILE: PhoneMirrorView/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  PhoneMirrorView:
    build:
      targets:
        PhoneMirrorView: all
    run:
      config: Debug
